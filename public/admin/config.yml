# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: MaxNoragami/tum-web-lab2
  branch: main

i18n:
  structure: multiple_folders
  locales: [ro, en]
  default_locale: ro

media_folder: public/images
public_folder: /images

singletons:
  - name: global
    label: Global
    file: src/content/{{locale}}/global.json
    i18n: true
    fields:
      - { label: CTA Text, name: cta_text, widget: string, i18n: true }

  - name: hero
    label: Hero Section
    file: src/content/{{locale}}/hero.json
    i18n: true
    fields:
      - { label: Title Highlighted 1, name: title_highlighted_1, widget: string, i18n: true }
      - { label: Title Middle, name: title_middle, widget: string, i18n: true }
      - { label: Title Highlighted 2, name: title_highlighted_2, widget: string, i18n: true }
      - { label: Title Suffix, name: title_suffix, widget: string, i18n: true }
      - { label: Description, name: description, widget: string, i18n: true }
